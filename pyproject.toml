[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tzmeet"
version = "0.1.0"
description = "Find a meeting time that works in every timezone."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alisher Muhammadaliyev", email = "viltrumlik@gmail.com" }]
keywords = ["timezone", "meeting", "scheduling", "remote-work", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
# Windows'da Python o'z vaqt mintaqasi bazasini olib yurmaydi, shuning
# uchun faqat o'sha yerda tzdata kerak. macOS va Linux'da bog'liqlik yo'q.
dependencies = ['tzdata; sys_platform == "win32"']

[project.urls]
Homepage = "https://github.com/Viltrumlik/tzmeet"
Issues = "https://github.com/Viltrumlik/tzmeet/issues"

[project.scripts]
tzmeet = "tzmeet:main"

[tool.setuptools]
py-modules = ["tzmeet"]
